<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стаття | The Beauty Loft</title>
    <link rel="stylesheet" href="css/style.css"> 
    <style>
        .post-container { max-width: 800px; margin: 100px auto; padding: 20px; }
        .post-header img { width: 100%; border-radius: 15px; margin-bottom: 20px; }
        .post-body { line-height: 1.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="post-container" id="post-content">
        <p>Завантаження статті...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function loadSinglePost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const container = document.getElementById('post-content');

            // ПРИМІТКА: Заміни 'ВАШ_ЛОГІН' на свій нікнейм GitHub
            const repoOwner = 'PGLVK';
            const repoName = 'beauty-loft-clean';

            try {
                const response = await fetch(`https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/blog/${postId}`);
                const post = await response.json();

                container.innerHTML = `
                    <div class="post-header">
                        <img src="${post.image}" alt="${post.title}">
                        <span class="blog-date">${new Date(post.date).toLocaleDateString('uk-UA')}</span>
                        <h1>${post.title}</h1>
                    </div>
                    <div class="post-body">
                        ${marked.parse(post.body)}
                    </div>
                    <br><a href="index.html" class="read-more">← Назад до блогу</a>
                `;
            } catch (e) {
                container.innerHTML = 'Статтю не знайдено.';
            }
        }
        loadSinglePost();
    </script>
</body>
</html>
