<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стаття | The Beauty Loft</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; line-height: 1.8; color: #333; margin: 0; background: #fff; }
        .article-wrap { max-width: 850px; margin: 0 auto; padding: 60px 20px; }
        .back-link { display: inline-block; margin-bottom: 40px; text-decoration: none; color: #c4a484; font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .article-header img { width: 100%; height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 40px; }
        .article-date { color: #c4a484; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; font-weight: 700; }
        .article-title { font-family: 'Playfair Display', serif; font-size: 48px; line-height: 1.1; margin: 20px 0 40px; color: #1a1a1a; }
        .article-body { font-size: 18px; color: #444; }
        .article-body h3 { font-family: 'Playfair Display', serif; font-size: 32px; margin-top: 50px; color: #1a1a1a; }
        .article-body p { margin-bottom: 25px; }
        .cta-box { margin-top: 60px; padding: 40px; background: #f9f9f9; border-radius: 12px; text-align: center; }
        .btn-book { background: #1a1a1a; color: #fff; padding: 18px 40px; text-decoration: none; display: inline-block; font-weight: 700; text-transform: uppercase; border-radius: 4px; letter-spacing: 1px; }
        @media (max-width: 768px) { 
            .article-title { font-size: 32px; }
            .article-header img { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="article-wrap" id="post-content">
        <p>Завантажуємо атмосферу...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function loadPost() {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('post-content');

            try {
                const res = await fetch(`https://raw.githubusercontent.com/PGLVK/beauty-loft-clean/main/blog/${id}`);
                const p = await res.json();
                
                container.innerHTML = `
                    <a href="index.html#blog" class="back-link">← назад до блогу</a>
                    <div class="article-header">
                        <img src="${p.image}" alt="${p.title}">
                        <div class="article-date">${new Date(p.date).toLocaleDateString('uk-UA')}</div>
                        <h1 class="article-title">${p.title}</h1>
                    </div>
                    <div class="article-body">${marked.parse(p.body)}</div>
                    <div class="cta-box">
                        <h3 style="margin-top:0">Ваші стопи чекають на це</h3>
                        <p>Запишіться на професійне відновлення в The Beauty Loft вже сьогодні.</p>
                        <a href="index.html#booking-form" class="btn-book">Записатись на візит</a>
                    </div>
                `;
                document.title = p.title;
            } catch (e) {
                container.innerHTML = '<h2>Статтю не знайдено</h2>';
            }
        }
        loadPost();
    </script>
</body>
</html>
